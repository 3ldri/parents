<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0b1e">
<title>Grumeaux App · Parents</title>
<style>
:root {
    --bg: #0d0b1e; --card: #1a1733; --card2: #241f45; --line: rgba(255, 255, 255, 0.08);
    --text: #f4f5fb; --muted: rgba(244, 245, 251, 0.6); --gold: #ffd34d; --xp: #9fd8ff;
    --plus: #3ee67a; --minus: #ff5f6d; --accent: #8b6bff;
    --rainbow: linear-gradient(90deg, #ff4d6d, #ffb627, #3ee67a, #3db8ff, #a45cff);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--text); font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; min-height: 100vh; padding-bottom: 40px; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; }

header { position: sticky; top: 0; z-index: 5; background: rgba(13, 11, 30, 0.94); padding: 14px 16px 0; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; }
.brand svg { width: 34px; height: 34px; flex: none; }
.brand h1 { font-size: 19px; font-weight: 800; }
.brand small { display: block; font-size: 12px; color: var(--muted); font-weight: 500; }
.brand .gear { margin-left: auto; background: var(--card); width: 38px; height: 38px; border-radius: 12px; font-size: 18px; }
.bar { height: 3px; background: var(--rainbow); margin: 12px -16px 0; }
.tabs { display: flex; gap: 6px; overflow-x: auto; padding: 12px 0; scrollbar-width: none; }
.tabs button { flex: 1; min-width: 80px; padding: 10px 8px; border-radius: 14px; background: var(--card); font-weight: 700; }
.tabs button.on { background: var(--accent); }

main { max-width: 640px; margin: 0 auto; padding: 16px; }
.status { font-size: 13px; color: var(--muted); margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #777; }
.dot.ok { background: var(--plus); }
.dot.old { background: #ffb627; }

.hero { background: var(--card); border-radius: 22px; padding: 18px; margin-bottom: 14px; }
.hero .name { font-size: 26px; font-weight: 800; }
.hero .nums { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 4px; font-weight: 700; }
.hero .nums .s { color: var(--gold); }
.hero .nums .x { color: var(--xp); }
.hero .lvl { color: var(--muted); font-size: 14px; margin-top: 2px; }
.prog { height: 10px; background: rgba(255, 255, 255, 0.1); border-radius: 6px; margin-top: 12px; overflow: hidden; }
.prog span { display: block; height: 100%; background: var(--rainbow); border-radius: 6px; }

section { background: var(--card); border-radius: 22px; padding: 16px; margin-bottom: 14px; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 12px; }
html, body { overflow-x: hidden; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.act span { min-width: 0; }
.act { display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 14px; background: var(--card2); text-align: left; min-height: 52px; }
.act b { min-width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-size: 15px; flex: none; }
.act.plus b { background: rgba(62, 230, 122, 0.18); color: var(--plus); }
.act.minus b { background: rgba(255, 95, 109, 0.18); color: var(--minus); }
.act:active { transform: scale(0.97); }
.act.done { opacity: 0.55; }
.act.done b { background: rgba(62, 230, 122, 0.3); color: var(--plus); }
.list { display: flex; flex-direction: column; gap: 8px; }
.custom { display: flex; gap: 8px; margin-top: 10px; }
.stepper { display: flex; align-items: center; background: var(--card2); border-radius: 14px; }
.stepper button { width: 38px; height: 48px; background: none; font-size: 22px; font-weight: 700; }
.stepper span { min-width: 34px; text-align: center; font-weight: 800; }
.custom input { flex: 1; min-width: 0; background: var(--card2); border: 1px solid var(--line); border-radius: 14px; padding: 0 12px; }
.send { background: var(--accent); border-radius: 14px; padding: 0 16px; font-weight: 700; }
.chests { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.chest { padding: 12px 6px; border-radius: 14px; background: var(--card2); text-align: center; font-weight: 700; font-size: 14px; }
.chest i { display: block; width: 26px; height: 20px; margin: 0 auto 6px; border-radius: 6px 6px 3px 3px; border: 3px solid currentColor; }
.chest small { display: block; color: var(--muted); font-weight: 500; }
.log div { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.log div:last-child { border: 0; }
.log .p { color: var(--plus); font-weight: 700; white-space: nowrap; }
.log .m { color: var(--minus); font-weight: 700; white-space: nowrap; }
.empty { color: var(--muted); font-size: 14px; }

.setup { max-width: 480px; margin: 40px auto; padding: 0 16px; }
.setup .card { background: var(--card); border-radius: 22px; padding: 22px; }
.setup h2 { color: var(--text); font-size: 20px; text-transform: none; letter-spacing: 0; }
.setup p { color: var(--muted); margin-bottom: 14px; font-size: 15px; }
.setup input { width: 100%; height: 50px; background: var(--card2); border: 1px solid var(--line); border-radius: 14px; padding: 0 14px; font-family: ui-monospace, Consolas, monospace; margin-bottom: 12px; }
.setup .send { width: 100%; height: 50px; }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 120px); background: #fff; color: #111; padding: 12px 18px; border-radius: 14px; font-weight: 600; max-width: calc(100% - 32px); transition: transform 0.25s; z-index: 10; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4); }
.toast.show { transform: translate(-50%, 0); }
[hidden] { display: none !important; }

.field { display: flex; gap: 8px; }
.field input, .field textarea { flex: 1; min-width: 0; background: var(--card2); border: 1px solid var(--line); border-radius: 14px; padding: 12px; color: var(--text); font: inherit; }
.field textarea { resize: none; height: 70px; }
.row2 { display: flex; gap: 8px; margin-top: 8px; align-items: stretch; }
.row2 .send { flex: 1; height: 48px; }
.quest { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; background: var(--card2); margin-top: 8px; }
.quest span { flex: 1; min-width: 0; }
.quest b { color: var(--gold); white-space: nowrap; }
.mini { height: 38px; min-width: 38px; padding: 0 10px; border-radius: 10px; font-weight: 700; background: rgba(255, 255, 255, 0.08); }
.mini.ok { background: rgba(62, 230, 122, 0.2); color: var(--plus); }
.mini.ko { background: rgba(255, 95, 109, 0.18); color: var(--minus); }
.hint { font-size: 13px; color: var(--muted); margin-top: 8px; }
.mrow { padding: 12px 0; border-bottom: 1px solid var(--line); }
.mrow:last-child { border: 0; padding-bottom: 0; }
.mrow .top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; font-weight: 700; }
.mrow .top small { color: var(--gold); font-weight: 700; }
.btns { display: flex; gap: 6px; flex-wrap: wrap; }
.btns input.date { width: auto; flex: 1; min-width: 150px; color-scheme: dark; }
.btns input { width: 84px; background: var(--card2); border: 1px solid var(--line); border-radius: 10px; padding: 0 10px; height: 38px; color: var(--text); font: inherit; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; padding: 12px 0; background: none; text-align: left; border-bottom: 1px solid var(--line); }
.switch:last-child { border: 0; }
.switch i { width: 50px; height: 30px; border-radius: 15px; background: rgba(255, 255, 255, 0.15); position: relative; flex: none; transition: background 0.2s; }
.switch i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform 0.2s; }
.switch.on i { background: var(--plus); }
.switch.on i::after { transform: translateX(20px); }
.share { display: flex; gap: 16px; align-items: center; }
.share img { width: 132px; height: 132px; border-radius: 12px; background: #fff; flex: none; }
.share p { font-size: 14px; color: var(--muted); }
.mini.pick.on { background: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
.chip { padding: 8px 12px; border-radius: 20px; background: var(--card2); font-size: 14px; }
.send.danger { background: #c62f45; }
.lbl { font-size: 13px; color: var(--muted); margin: 12px 0 6px; font-weight: 600; }
.mini small { font-weight: 500; opacity: 0.75; }
.dlc { display: flex; gap: 12px; align-items: flex-start; padding: 12px; border-radius: 16px; background: var(--card2); margin-top: 8px; }
.vthumb { flex: none; width: 96px; height: 54px; border-radius: 10px; object-fit: cover; background: #000; }
.dlcart { flex: none; width: 58px; height: 58px; border-radius: 14px; display: grid; place-items: center; font-size: 32px; box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.25); }
.dlcinfo { flex: 1; min-width: 0; }
.dlcinfo b { display: block; font-size: 16px; }
.dlcinfo small { display: block; color: var(--muted); font-size: 13px; margin: 2px 0 8px; }
.dlced { margin-top: 14px; padding: 14px; border-radius: 18px; background: rgba(139, 107, 255, 0.1); border: 1px solid rgba(139, 107, 255, 0.35); }
.dlccover { position: relative; overflow: hidden; height: 190px; border-radius: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 12px; text-align: center; box-shadow: inset 0 -6px 0 rgba(0, 0, 0, 0.25); }
.dlccover .big { font-size: 78px; line-height: 1; filter: drop-shadow(0 5px 0 rgba(0, 0, 0, 0.3)); }
.dlccover b { font-size: 22px; font-weight: 900; text-shadow: 0 2px 0 rgba(0, 0, 0, 0.45); }
.dlccover .tag { position: absolute; top: 12px; right: -30px; transform: rotate(35deg); background: #ff3d6e; font-weight: 900; font-size: 12px; letter-spacing: 2px; padding: 4px 34px; }
.emojis { display: flex; flex-wrap: wrap; gap: 6px; }
.emojis button { width: 44px; height: 44px; border-radius: 12px; font-size: 24px; background: var(--card2); }
.emojis button.on { outline: 3px solid var(--gold); }
.emojis button.sw { width: 36px; height: 36px; }
.qmeta { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
.wheel { position: relative; width: min(280px, 80vw); margin: 16px auto 6px; }
.wheel svg { width: 100%; display: block; transition: transform 4s cubic-bezier(0.15, 0.7, 0.15, 1); }
.wheel svg text { font: 800 15px system-ui, sans-serif; fill: #fff; }
.wheel i { position: absolute; left: 50%; top: -8px; margin-left: -12px; z-index: 1; border-left: 12px solid transparent; border-right: 12px solid transparent; border-top: 24px solid #fff; }
.wheelres { text-align: center; font-size: 22px; font-weight: 800; color: var(--gold); min-height: 30px; }
.send.alt { background: var(--card2); border: 1px solid var(--accent); }
.revnums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
.revnums div { background: var(--card2); border-radius: 14px; padding: 10px 6px; }
.revnums b { display: block; font-size: 22px; color: var(--gold); }
.revnums small { font-size: 12px; color: var(--muted); }
.subj { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
.sb { display: grid; grid-template-columns: 76px 1fr 92px; gap: 8px; align-items: center; font-size: 14px; }
.sb i { height: 10px; border-radius: 6px; background: rgba(255, 255, 255, 0.1); overflow: hidden; }
.sb em { display: block; height: 100%; background: var(--plus); border-radius: 6px; }
.sb em.mid { background: var(--gold); }
.sb em.lo { background: var(--minus); }
.sb small { color: var(--muted); text-align: right; }
.tvsays { font-size: 13px; background: rgba(139, 107, 255, 0.15); border-radius: 12px; padding: 8px 12px; margin-bottom: 12px; }
.news { background: linear-gradient(135deg, rgba(139, 107, 255, 0.28), rgba(255, 170, 60, 0.18)); }
.news h2 { display: flex; align-items: center; gap: 8px; }
.news h2 em { font-style: normal; font-size: 11px; background: #ffb43c; color: #2a1a00; border-radius: 99px; padding: 2px 8px; }
.cl { margin: 0 0 6px; }
.cl summary { cursor: pointer; font-weight: 700; padding: 6px 0; }
.cl summary small { color: var(--muted); font-weight: 400; margin-left: 6px; }
.cl ul, .news ul { margin: 4px 0 8px; padding-left: 20px; font-size: 14px; line-height: 1.45; }
.cl li, .news li { margin-bottom: 4px; }
</style>
</head>
<body>

<header id="top" hidden>
    <div class="brand">
        <svg viewBox="0 0 512 512"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff4d6d"/><stop offset=".25" stop-color="#ffb627"/><stop offset=".5" stop-color="#3ee67a"/><stop offset=".75" stop-color="#3db8ff"/><stop offset="1" stop-color="#a45cff"/></linearGradient></defs><path d="M256 128 L176 52 M256 128 L340 44" stroke="#fff" stroke-width="18" stroke-linecap="round"/><rect x="48" y="112" width="416" height="338" rx="74" fill="url(#g)"/><rect x="92" y="150" width="328" height="226" rx="34" fill="#1a1440"/></svg>
        <div><h1>Grumeaux App</h1><small>Espace parents</small></div>
        <button class="gear" id="gear" aria-label="Changer de sujet">⚙</button>
    </div>
    <div class="bar"></div>
    <nav class="tabs" id="tabs"></nav>
</header>

<main id="app" hidden>
    <div class="status"><span class="dot" id="dot"></span><span id="statusText">Connexion à la TV…</span></div>
    <div id="view"></div>
</main>

<div class="setup" id="setup" hidden>
    <div class="card">
        <h2>Relier à la TV</h2>
        <p>Sur la TV, ouvre <b>Bonus / Malus</b> : le nom du sujet est affiché sous le QR code (il commence par <code>tvperso-</code>).</p>
        <input id="topicInput" placeholder="tvperso-…" autocapitalize="off" autocomplete="off" spellcheck="false">
        <button class="send" id="topicSave">Valider</button>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
    'use strict';

    var NTFY = 'https://ntfy.sh/';
    var BONUS = [[1, 'Aide à la maison'], [1, 'Devoirs faits'], [1, 'Chambre rangée'], [2, 'Très sage'], [3, 'Exploit !']];
    var MALUS = [[-1, 'Bêtise'], [-1, 'Dispute'], [-2, 'N’a pas écouté'], [-3, 'Grosse bêtise']];
    var CHESTS = [['bronze', 'Bronze', '#c27a3a'], ['argent', 'Argent', '#c3cad6'], ['or', 'Or', '#f4c430']];
    var KIDS = [{ id: 'milan', name: 'Milan', color: '#ff6b6b' }, { id: 'willo', name: 'Willo', color: '#ffb547' }, { id: 'rogan', name: 'Rogan', color: '#b18cff' }];
    var TIMERS = [[0, 'Sans limite'], [10, '10 min'], [15, '15 min'], [20, '20 min'], [30, '30 min'], [45, '45 min'], [60, '1 h'], [120, '2 h']];
    var OPTS = [['turns', 'Tour de rôle « qui choisit »'], ['seasonal', 'Décorations de saison'], ['world', 'Décor qui grandit avec le niveau']];
    var PEOPLE = KIDS.concat([{ id: 'al', name: 'Al', color: '#6d7cff' }, { id: '3ldri', name: '3ldri', color: '#2fd9a4' }]);
    var PARENTS = [{ id: 'al', name: 'Al' }, { id: '3ldri', name: '3ldri' }];
    var CHEERS = ['Je suis fier de toi !', 'Bravo pour tes efforts !', 'Tu es génial, continue !', 'Bonne journée mon champion !', 'Je t’aime fort ❤', 'Courage pour ton contrôle !'];
    var sender = store('grumeaux.sender') || 'al';
    var TABS = KIDS.concat([{ id: 'tous', name: 'Tous' }, { id: 'gestion', name: 'Gestion' }]);

    var topic = '', state = null, current = 'milan', customN = 1, questN = 2, refreshTimer = null, pendingOpts = {};
    var qFor = null, qTeam = [], qChef = '', qMin = 0;
    // dates en cours de saisie (le rafraîchissement automatique ne doit pas les effacer) et dates envoyées
    var bdEdit = {}, bdSaved = {}, lessons = [];
    var LEVELS = [['auto', 'Selon l’âge'], ['1', 'CM1'], ['2', 'CM2 – 6e'], ['3', '5e – 4e']];
    var SUBJ = [['maths', 'Maths'], ['francais', 'Français'], ['sciences', 'Sciences'], ['histoire', 'Histoire'], ['culture', 'Culture'], ['cartes', 'Leçons']];
    var wheelPeople = (store('grumeaux.roue') || 'milan,willo').split(',').filter(function (id) { return PEOPLE.some(function (p) { return p.id === id; }); });
    var wheelRot = 0, wheelSpinning = false, wheelResult = '';
    if (wheelPeople.length < 2) wheelPeople = ['milan', 'willo'];

    function $(id) { return document.getElementById(id); }
    function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
    function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
    function pageLink() { return location.origin + location.pathname + '#' + topic; }

    function toast(msg) {
        var el = $('toast');
        el.textContent = msg;
        el.classList.add('show');
        clearTimeout(toast.t);
        toast.t = setTimeout(function () { el.classList.remove('show'); }, 2600);
    }

    // ---------- Liaison ----------

    function start() {
        var fromHash = decodeURIComponent(location.hash.replace(/^#/, '')).trim();
        topic = fromHash || store('grumeaux.topic') || '';
        if (fromHash) store('grumeaux.topic', fromHash);
        if (!/^tvperso-[a-z0-9]{6,}$/.test(topic)) { showSetup(); return; }
        $('setup').hidden = true;
        $('top').hidden = false;
        $('app').hidden = false;
        renderTabs();
        render();
        loadState();
        loadLessons();
        send('sync', true);
        setInterval(loadState, 15000);
        setInterval(loadLessons, 60000);
    }

    function showSetup() {
        $('top').hidden = true;
        $('app').hidden = true;
        $('setup').hidden = false;
        $('topicInput').value = topic;
    }

    $('topicSave').onclick = function () {
        var v = $('topicInput').value.trim().toLowerCase();
        if (!/^tvperso-[a-z0-9]{6,}$/.test(v)) { toast('Le code doit ressembler à tvperso-abc123…'); return; }
        store('grumeaux.topic', v);
        location.hash = v;
        location.reload();
    };
    $('gear').onclick = showSetup;

    // Dernier état publié par la TV (gardé 12 h par ntfy)
    function loadState() {
        fetch(NTFY + topic + '-etat/json?poll=1&since=12h').then(function (r) { return r.text(); }).then(function (txt) {
            var last = null;
            txt.trim().split('\n').forEach(function (l) { try { var m = JSON.parse(l); if (m.event === 'message') last = m; } catch (e) { /* ligne ignorée */ } });
            if (last) { try { state = JSON.parse(last.message); pendingOpts = {}; } catch (e) { /* message illisible */ } }
            if (!isTyping()) render(); else renderStatus();
        }).catch(function () { setStatus('', 'Pas de connexion internet'); });
    }

    function isTyping() {
        var a = document.activeElement;
        return a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA') && a.value;
    }

    function send(cmd, silent) {
        return fetch(NTFY + topic, { method: 'POST', body: cmd }).then(function (r) {
            if (!r.ok) throw new Error();
            if (!silent) toast('Envoyé ✓ La TV l’appliquera dans quelques secondes');
            // on relit l'état plusieurs fois le temps que la TV traite la commande
            clearInterval(refreshTimer);
            var n = 0;
            refreshTimer = setInterval(function () { loadState(); if (++n >= 6) clearInterval(refreshTimer); }, 6000);
        }).catch(function () { toast('Échec de l’envoi, vérifie ta connexion'); });
    }

    // ---------- Affichage ----------

    function setStatus(cls, text) {
        $('dot').className = 'dot ' + cls;
        $('statusText').textContent = text;
    }

    function ago(t) {
        var m = Math.round((Date.now() - t) / 60000);
        return m < 1 ? 'à l’instant' : m < 60 ? 'il y a ' + m + ' min' : 'il y a ' + Math.round(m / 60) + ' h';
    }

    function renderStatus() {
        if (!state) { setStatus('', 'En attente de la TV… (elle doit être allumée sur Grumeaux App)'); return; }
        var fresh = Date.now() - state.t < 30 * 60000;
        setStatus(fresh ? 'ok' : 'old', 'Données de la TV ' + ago(state.t) + (fresh ? '' : ' (TV éteinte ou sur une autre appli ?)'));
    }

    function renderTabs() {
        $('tabs').innerHTML = TABS.map(function (k) {
            return '<button data-kid="' + k.id + '" class="' + (k.id === current ? 'on' : '') + '">' + esc(k.name) + '</button>';
        }).join('');
    }

    $('tabs').onclick = function (e) {
        var b = e.target.closest('button');
        if (!b) return;
        current = b.getAttribute('data-kid');
        customN = 1;
        renderTabs();
        render();
        window.scrollTo(0, 0);
    };

    function kidState(id) {
        if (!state || !state.kids) return null;
        for (var i = 0; i < state.kids.length; i++) if (state.kids[i].id === id) return state.kids[i];
        return null;
    }

    // « 14/03/2015 » <-> « 2015-03-14 » (champ date du téléphone)
    function toIso(s) {
        var m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(s || '');
        return m ? m[3] + '-' + ('0' + m[2]).slice(-2) + '-' + ('0' + m[1]).slice(-2) : '';
    }

    function ageOf(s) {
        var m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(s || '');
        if (!m) return null;
        var now = new Date(), age = now.getFullYear() - m[3];
        if (now.getMonth() + 1 < +m[2] || (now.getMonth() + 1 === +m[2] && now.getDate() < +m[1])) age--;
        return age >= 0 ? age : null;
    }

    function nameOf(id) {

    // ---------- Vidéos : seules celles ajoutées ici peuvent être regardées sur la TV ----------

    // ---------- DLC : packs de questions avec un titre fun et une image ----------

    var packs = [], dlcEdit = null, dlcOpen = '';
    // les images sont les compagnons du jeu (dessinés sur la TV) ; [clé, emoji, nom]
    var DLC_IMGS = [['dragon', '🐉', 'le Dragon'], ['unicorn', '🦄', 'la Licorne'], ['raptor', '🦖', 'le Raptor'], ['dino', '🦕', 'le Dino'], ['fox', '🦊', 'le Renard'],
        ['owl', '🦉', 'la Chouette'], ['pegasus', '🐴', 'Pégase'], ['mammoth', '🦣', 'le Mammouth'], ['smilodon', '🐯', 'le Tigre à dents de sabre'], ['alien', '👽', 'l’Alien'],
        ['robot', '🤖', 'le Robot'], ['parrot', '🦜', 'le Perroquet'], ['turtle', '🐢', 'la Tortue'], ['cat', '🐱', 'le Chat'], ['dog', '🐶', 'le Chien'], ['pig', '🐷', 'le Cochon']];
    var DLC_COLORS = ['#7b3fd6', '#4a6cf7', '#14a3c7', '#2fbf71', '#e0a800', '#ef7a2a', '#ff3d6e', '#c2185b'];
    var FUN_TITLES = ['Opération {S}', '{S} : la revanche {a}', '{S} en folie !', 'Mission {S}', '{S} Party !', 'Super {S} Turbo', '{S} contre {A}',

    function imgOf(key) { return DLC_IMGS.filter(function (i) { return i[0] === key; })[0] || DLC_IMGS[5]; }
    // « du Dragon », « de la Licorne », « de l’Alien », « de Pégase »
    function deName(n) { return n.indexOf('le ') === 0 ? 'du ' + n.slice(3) : 'de ' + n; }

    function funTitle(subject, img) {

    function newPackId() { return (Date.now().toString(36) + Math.random().toString(36).slice(2, 6)).slice(-10); }

            });

        if (!mine.length) html += '<p class="empty">Aucune leçon pour l’instant. Crée un DLC, importe un fichier ou ajoute une question ci-dessous.</p>';
        html += '<div class="btns" style="margin-top:12px"><button class="mini pick" id="dlcNew">✨ Créer un DLC</button><button class="mini pick" id="dlcImport">📂 Importer un fichier</button>' +
            (packs.some(function (p) { return p.ok; }) ? '<button class="mini" id="dlcExportAll">⬇ Tout exporter</button>' : '') +
            '<button class="mini" id="dlcModel">📄 Fichier modèle</button></div>' +
            '<input type="file" id="dlcFile" accept=".txt,.csv,.json,text/plain,application/json" hidden>';
        if (dlcEdit) html += dlcEditor();
        html += '<p class="lbl" style="margin-top:16px">Ajout rapide dans « Leçons de la semaine »</p>' +
            '<div class="field"><input id="lessonQ" placeholder="Question (ex. : Capitale de l’Espagne ?)" maxlength="90"></div>' +

    function dlcEditor() {
        var d = dlcEdit, im = imgOf(d.img);
        return '<div class="dlced"><div class="dlccover" id="dlcCover" style="background:' + esc(d.color) + '"><span class="tag">DLC</span><div class="big">' + im[1] + '</div><b id="dlcCoverTitle">' + esc(d.title || 'Titre du DLC') + '</b></div>' +
            '<p class="lbl">Titre</p><div class="field"><input id="dlcTitle" placeholder="Ex. : Opération Fractions" maxlength="40" value="' + esc(d.title) + '"></div>' +
            '<div class="field" style="margin-top:8px"><input id="dlcSubject" placeholder="Sujet pour le titre fun (ex. : fractions)" maxlength="24"><button class="send" id="dlcFun">🎲 Titre fun</button></div>' +
            '<p class="lbl">Image</p><div class="emojis">' + DLC_IMGS.map(function (i) { return '<button class="' + (i[0] === d.img ? 'on' : '') + '" data-dimg="' + i[0] + '" title="' + esc(i[2]) + '">' + i[1] + '</button>'; }).join('') + '</div>' +
            '<p class="lbl">Couleur</p><div class="emojis">' + DLC_COLORS.map(function (c) { return '<button class="sw' + (c === d.color ? ' on' : '') + '" data-dcol="' + c + '" style="background:' + c + '"></button>'; }).join('') + '</div>' +
            '<p class="lbl">Pour</p><div class="btns">' + KIDS.concat([{ id: 'tous', name: 'Tous' }]).map(function (k) { return '<button class="mini pick' + (k.id === d.who ? ' on' : '') + '" data-dwho="' + k.id + '">' + esc(k.name) + '</button>'; }).join('') + '</div>' +
            '<p class="lbl">Questions : une par ligne, « question | réponse »</p><div class="field"><textarea id="dlcText" rows="8" placeholder="Combien font 7 × 8 ? | 56&#10;Capitale de l’Italie ? | Rome">' + esc(d.text) + '</textarea></div>' +
            '<p class="hint" id="dlcCount">' + countLabel(d.text) + '</p>' +
            '<div class="row2"><button class="send" id="dlcSend">Envoyer à la TV</button><button class="mini" id="dlcCancel">Annuler</button></div></div>';
    }

    function textCards(text) {
        var out = [];
        String(text || '').split('\n').forEach(function (l) { var c = splitLine(l); if (c) out.push(c); });
        return out;
    }

    // « question | réponse », ou séparée par une tabulation ou un point-virgule (fichiers de tableur)
    function splitLine(line) {
        var l = line.replace(/\r/g, '').trim();
        if (!l || l.charAt(0) === '#') return null;
        var sep = l.indexOf('|') > -1 ? '|' : l.indexOf('\t') > -1 ? '\t' : l.indexOf(';') > -1 ? ';' : null;
        if (!sep) return null;
        var i = l.indexOf(sep), q = clean(l.slice(0, i).replace(/^"|"$/g, ''), 90), a = clean(l.slice(i + 1).replace(/^"|"$/g, '').replace(/[;\t]+$/, ''), 50);
        return q && a ? [q, a] : null;
    }

    function countLabel(text) {
        var n = textCards(text).length;
        return n ? n + ' question' + (n > 1 ? 's' : '') + ' prête' + (n > 1 ? 's' : '') + (n > 120 ? ' (120 au maximum par DLC)' : '') + (n < 4 ? ' · avec 4 questions ou plus, la TV propose des réponses à choisir' : '') : 'Aucune question pour l’instant';
    }

    // Fichier texte (titre: / image: / couleur: / pour: puis les questions) ou JSON ; plusieurs DLC possibles
    function parseDlcFile(text, fileName) {
        text = text.replace(/^﻿/, '');
        var name = clean(fileName.replace(/\.[a-z]+$/i, '').replace(/[-_]+/g, ' '), 40) || 'Mon DLC', list = [];
        if (/^\s*[\[{]/.test(text)) {
            var data = JSON.parse(text);
            (Array.isArray(data) ? data : data.dlc || [data]).forEach(function (o) {
                var qs = (o.questions || o.cartes || []).map(function (x) { return Array.isArray(x) ? [x[0], x[1]] : [x.q || x.question, x.r || x.a || x.reponse || x['réponse'] || x.answer]; });
                list.push(fillPack({ title: o.titre || o.title, img: o.image, color: o.couleur || o.color, who: o.pour || o.who, cards: qs.map(function (c) { return [clean(c[0], 90), clean(c[1], 50)]; }).filter(function (c) { return c[0] && c[1]; }) }, name));
            });
            return list.filter(function (p) { return p.cards.length; });
        }
        var cur = null;
        text.split('\n').forEach(function (line) {
            var m = /^\s*(titre|title|image|couleur|color|pour)\s*:\s*(.*)$/i.exec(line);
            if (m) {
                var key = m[1].toLowerCase();
                if (key === 'titre' || key === 'title' || !cur) { cur = { cards: [] }; list.push(cur); }
                cur[{ titre: 'title', title: 'title', image: 'img', couleur: 'color', color: 'color', pour: 'who' }[key]] = m[2].trim();
                return;
            }
            var c = splitLine(line);
            if (!c) return;
            if (!cur) { cur = { cards: [] }; list.push(cur); }
            cur.cards.push(c);
        });
        return list.filter(function (p) { return p.cards.length; }).map(function (p) { return fillPack(p, name); });
    }

    // Valeurs par défaut et conversion : image en emoji ou en nom, enfant par son prénom
    function fillPack(p, name) {
        var img = String(p.img || '').trim().toLowerCase(), who = clean(p.who, 20).toLowerCase();
        var im = DLC_IMGS.filter(function (i) { return i[0] === img || i[1] === img || i[2].toLowerCase().indexOf(img) > -1 && img.length > 2; })[0];
        var kid = KIDS.filter(function (k) { return k.id === who || k.name.toLowerCase() === who; })[0];
        return {
            title: clean(p.title, 40) || name, img: im ? im[0] : DLC_IMGS[Math.floor(Math.random() * DLC_IMGS.length)][0],
            color: /^#[0-9a-f]{6}$/i.test(p.color || '') ? p.color : DLC_COLORS[Math.floor(Math.random() * DLC_COLORS.length)],
            who: kid ? kid.id : current !== 'gestion' && current !== 'tous' && !who ? current : 'tous', cards: p.cards
        };
    }

    // Un DLC part en plusieurs messages : l'en-tête, puis les questions par paquets de moins de 3 Ko
    function sendPack(p) {
        var cards = p.cards.slice(0, 120), bodies = ['dlc ' + p.id + ' ' + p.who + ' ' + p.img + ' ' + p.color + ' ' + cards.length + ' ' + clean(p.title, 40)], cur = 'dlc+ ' + p.id;
        cards.forEach(function (c) {
            var line = '\n' + c[0] + ' | ' + c[1];
            if (bytes(cur + line) > 3000) { bodies.push(cur); cur = 'dlc+ ' + p.id; }
            cur += line;
        });
        bodies.push(cur);
        return bodies.reduce(function (pr, b) {
            return pr.then(function () { return fetch(NTFY + topic, { method: 'POST', body: b }).then(function (r) { if (!r.ok) throw new Error(); }); });
        }, Promise.resolve());
    }

    function sendPacks(list) {
        var chain = list.reduce(function (pr, p) { return pr.then(function () { return sendPack(p); }); }, Promise.resolve());
        chain.then(function () {
            toast(list.length > 1 ? list.length + ' DLC envoyés ✓' : 'DLC « ' + list[0].title + ' » envoyé ✓');
            dlcEdit = null;
            render();
            [8000, 20000, 40000].forEach(function (t) { setTimeout(loadLessons, t); });
            setTimeout(loadState, 8000);
        }).catch(function () { toast('Échec de l’envoi, vérifie ta connexion'); });
    }

    function packFile(list) {
        return '# Grumeaux App · DLC de révision\n# Une question par ligne : question | réponse\n# image : ' + DLC_IMGS.map(function (i) { return i[0]; }).join(', ') + '\n' +
            list.map(function (p) {
                return '\ntitre: ' + p.title + '\nimage: ' + p.img + '\ncouleur: ' + p.color + '\npour: ' + (p.who === 'tous' ? 'tous' : nameOf(p.who)) + '\n' +
                    p.cards.map(function (c) { return c[0] + ' | ' + c[1]; }).join('\n') + '\n';
            }).join('');
    }

    function download(name, text) {
        var a = document.createElement('a');

        document.body.appendChild(a);

    }

    function slug(s) { return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'dlc'; }

    function exportable(p) {
        return { title: p.title, img: p.img, color: p.color, who: p.id === 'base' ? 'tous' : p.who, cards: packCards(p.id).map(function (c) { return [c.q, c.a]; }) };

    function dlcClick(b) {

            return true;
        }
        if (b.id === 'dlcExportAll') { download('dlc-grumeaux.txt', packFile(packs.filter(function (p) { return p.ok; }).map(exportable))); return true; }
        if ((v = b.getAttribute('data-dlcexp'))) { var pe = packs.filter(function (p) { return p.id === v; })[0]; download(slug(pe.title) + '.txt', packFile([exportable(pe)])); return true; }
        if ((v = b.getAttribute('data-dlcopen'))) { dlcOpen = dlcOpen === v ? '' : v; render(); return true; }
        if ((v = b.getAttribute('data-dlcedit'))) {
            var pm = packs.filter(function (p) { return p.id === v; })[0];
            dlcEdit = { id: pm.id, title: pm.title, img: pm.img, color: pm.color, who: pm.who, text: packCards(pm.id).map(function (c) { return c.q + ' | ' + c.a; }).join('\n') };
            render();
            $('dlcTitle').scrollIntoView({ block: 'center' });
            return true;
        }
        if (!dlcEdit) return false;
        syncEditor();
        if ((v = b.getAttribute('data-dimg'))) dlcEdit.img = v;
        else if ((v = b.getAttribute('data-dcol'))) dlcEdit.color = v;
        else if ((v = b.getAttribute('data-dwho'))) dlcEdit.who = v;

            sendPacks([{ id: dlcEdit.id, title: dlcEdit.title, img: dlcEdit.img, color: dlcEdit.color, who: dlcEdit.who, cards: cards }]);

    }

    function syncEditor() {
        if (!dlcEdit || !$('dlcTitle')) return;

    $('view').addEventListener('input', function (e) {

    $('view').addEventListener('change', function (e) {
        if (e.target.id !== 'dlcFile' || !e.target.files[0]) return;

        rd.onload = function () {
            var list;
            try { list = parseDlcFile(String(rd.result), f.name); } catch (err) { toast('Fichier illisible : vérifie le format'); return; }
            if (!list.length) { toast('Aucune question trouvée (format : question | réponse)'); return; }
            if (list.length === 1) {
                var p = list[0];
                dlcEdit = { id: newPackId(), title: p.title, img: p.img, color: p.color, who: p.who, text: p.cards.map(function (c) { return c[0] + ' | ' + c[1]; }).join('\n') };

                return;

            var total = list.reduce(function (n, p) { return n + p.cards.length; }, 0);
            if (!confirm('Importer ' + list.length + ' DLC (' + total + ' questions) sur la TV ?\n\n' + list.map(function (p) { return '• ' + p.title + ' (' + p.cards.length + ')'; }).join('\n'))) return;
            sendPacks(list.map(function (p) { p.id = newPackId(); return p; }));
        };
        rd.readAsText(f, 'utf-8');
        e.target.value = '';
    });

    function revSection(id, k) {
        var r = k && k.rev;
        if (!r) return '';
        var html = '<section><h2>Révisions</h2><div class="revnums">' +
            '<div><b>' + (r.today ? '✓' : '—') + '</b><small>Révision du jour</small></div>' +
            '<div><b>' + r.streak + '</b><small>jours de suite (record ' + r.best + ')</small></div>' +
            '<div><b>' + r.herc + '/12</b><small>Travaux d’Hercule</small></div></div>' +
            '<p class="lbl">Niveau des questions</p><div class="btns">' + LEVELS.map(function (l) {
                var on = l[0] === 'auto' ? r.auto : !r.auto && String(r.lvl) === l[0];
                return '<button class="mini pick' + (on ? ' on' : '') + '" data-cmd="niveau ' + id + ' ' + l[0] + '">' + l[1] + (l[0] === 'auto' && r.auto ? ' (' + ['', 'CM1', 'CM2 – 6e', '5e – 4e'][r.lvl] + ')' : '') + '</button>';
            }).join('') + '</div><div class="subj">';
        var weak = [];
        SUBJ.forEach(function (s) {
            var x = r.subj[s[0]];
            if (!x || !x[1]) { html += '<div class="sb"><span>' + s[1] + '</span><i><em style="width:0"></em></i><small>pas encore</small></div>'; return; }
            var pct = Math.round(x[0] / x[1] * 100);
            if (x[1] >= 5 && pct < 60) weak.push(s[1]);
            html += '<div class="sb"><span>' + s[1] + '</span><i><em class="' + (pct < 50 ? 'lo' : pct < 75 ? 'mid' : '') + '" style="width:' + pct + '%"></em></i><small>' + pct + ' % · ' + x[1] + ' q.</small></div>';
        });
        html += '</div>' + (weak.length ? '<p class="hint">À retravailler : <b>' + weak.join(', ') + '</b></p>' : '<p class="hint">Les jauges montrent le pourcentage de bonnes réponses dans « Réviser ».</p>');
        return html + '</section>';
    }

    $('view').onclick = function (e) {
        var b = e.target.closest('button');
        if (!b) return;
        if (dlcClick(b)) return;
        var step = b.getAttribute('data-step');
        if (step) {
            var d = +b.getAttribute('data-d');
            if (step === 'cn') {
                customN += d;
                if (customN === 0) customN = d;
                customN = Math.max(-10, Math.min(10, customN));
                $('cn').textContent = (customN > 0 ? '+' : '') + customN;
            } else {
                questN = Math.max(1, Math.min(10, questN + d));
                $('qn').textContent = questN;
            }
            return;
        }
        if (b.id === 'customSend') {
            var why = $('reason').value.trim();
            send(current + ' ' + (customN > 0 ? '+' : '') + customN + (why ? ' ' + why : ''));
            $('reason').value = '';
            return;
        }
        if (b.id === 'questSend') {
            var q = $('questText').value.trim().replace(/\s+/g, ' ');
            if (!q) { toast('Écris d’abord la mission'); return; }
            if (!qTeam.length) { toast('Choisis au moins un participant'); return; }
            send('equipe ' + qTeam.join(',') + ' ' + (qTeam.length > 1 && qChef ? qChef : '-') + ' ' + questN + ' ' + qMin + ' ' + q);
            $('questText').value = '';
            return;
        }
        var tm = b.getAttribute('data-team');
        if (tm) {
            var at = qTeam.indexOf(tm);
            if (at > -1) qTeam.splice(at, 1); else qTeam = KIDS.map(function (x) { return x.id; }).filter(function (x) { return x === tm || qTeam.indexOf(x) > -1; });
            if (qTeam.indexOf(qChef) === -1) qChef = '';
            render();
            return;
        }
        if (b.hasAttribute('data-chef')) {
            var cv = b.getAttribute('data-chef');
            if (cv === '?') {
                qChef = qTeam[Math.floor(Math.random() * qTeam.length)];
                toast('Chef d’équipe tiré au sort : ' + nameOf(qChef) + ' 👑');
            } else qChef = cv;
            render();
            return;
        }
        if (b.hasAttribute('data-min')) {
            qMin = +b.getAttribute('data-min');
            render();
            return;
        }
        var wp = b.getAttribute('data-wheel');
        if (wp) {
            if (wheelSpinning) return;
            var wi = wheelPeople.indexOf(wp);
            if (wi > -1) {
                if (wheelPeople.length <= 2) { toast('Il faut au moins 2 personnes sur la roue'); return; }
                wheelPeople.splice(wi, 1);
            } else wheelPeople = PEOPLE.map(function (p) { return p.id; }).filter(function (x) { return x === wp || wheelPeople.indexOf(x) > -1; });
            store('grumeaux.roue', wheelPeople.join(','));
            wheelRot = 0;
            wheelResult = '';
            render();
            return;
        }
        if (b.id === 'spinPhone' || b.id === 'spinTv') { spin(b.id === 'spinTv'); return; }
        if (b.id === 'videoAdd' || b.id === 'videoShop') {
            var vy = ytId($('videoUrl').value), vn = $('videoName').value.replace(/\s+/g, ' ').trim() || 'Vidéo';
            if (!vy) { toast('Lien YouTube non reconnu'); return; }
            send((b.id === 'videoAdd' ? 'video-cadeau ' : 'video ') + current + ' ' + vy + ' ' + vn);
            $('videoUrl').value = '';
            $('videoName').value = '';
            setTimeout(loadLessons, 8000);
            setTimeout(loadLessons, 25000);
            return;
        }
        if (b.id === 'lessonAdd') {
            var lq = $('lessonQ').value.replace(/[|\s]+/g, ' ').trim(), la = $('lessonA').value.replace(/[|\s]+/g, ' ').trim();
            if (!lq || !la) { toast('Écris la question et la réponse'); return; }
            send('carte ' + current + ' ' + lq + ' | ' + la);
            $('lessonQ').value = '';
            $('lessonA').value = '';
            setTimeout(loadLessons, 8000);
            setTimeout(loadLessons, 25000);
            return;
        }
        if (b.id === 'msgSend') {
            var m = $('msgText').value.trim();
            if (!m) { toast('Écris d’abord le message'); return; }
            send(current + ' message ' + m.replace(/\s+/g, ' '));
            $('msgText').value = '';
            return;
        }
        if (b.id === 'newsOk') {
            newsSeen = CHANGELOG[0].v;
            store('grumeaux.news', newsSeen);
            render();
            return;
        }
        if (b.id === 'copyLink') {
            var link = pageLink();
            (navigator.clipboard ? navigator.clipboard.writeText(link) : Promise.reject()).then(function () { toast('Lien copié'); }, function () { prompt('Copie ce lien :', link); });
            return;
        }
        var kidStars = b.getAttribute('data-stars');
        if (kidStars) {
            var v = parseInt($('st-' + kidStars).value, 10);
            if (isNaN(v) || v < 0) { toast('Entre un nombre d’étoiles'); return; }
            if (!confirm('Mettre ' + nameOf(kidStars) + ' à ' + v + ' étoiles ?')) return;
            send(kidStars + ' etoiles ' + v);
            return;
        }
        var snd = b.getAttribute('data-sender');
        if (snd) {
            sender = snd;
            store('grumeaux.sender', snd);
            document.querySelectorAll('[data-sender]').forEach(function (x) { x.classList.toggle('on', x === b); });
            return;
        }
        var ch = b.getAttribute('data-cheer');
        if (ch) { $('visitText').value = ch; return; }
        if (b.id === 'visitSend') {
            var vt = $('visitText').value.trim();
            if (!vt) { toast('Écris d’abord ton petit mot'); return; }
            send(current + ' passage ' + sender + ' ' + vt.replace(/\s+/g, ' '));
            $('visitText').value = '';
            return;
        }
        var reset = b.getAttribute('data-reset');
        if (reset) {
            if (reset === 'tout') {
                var typed = prompt('Toutes les données de Grumeaux App seront effacées (étoiles, héros, réglages, anniversaires).\nÉcris RESET pour confirmer :');
                if (!typed || typed.trim().toUpperCase() !== 'RESET') { toast('Annulé'); return; }
            } else if (!confirm('Remettre à zéro toute la progression de ' + nameOf(reset) + ' ? (étoiles, XP, objets, coffres, badges)')) return;
            send('reset ' + reset);
            return;
        }
        var bdId = b.getAttribute('data-bd');
        if (bdId) {
            var iso = $('bd-' + bdId).value, parts = iso.split('-');
            var who = PEOPLE.filter(function (p) { return p.id === bdId; })[0].name;
            if (!iso && !confirm('Effacer l’anniversaire de ' + who + ' ?')) return;
            var fr = iso ? parts[2] + '/' + parts[1] + '/' + parts[0] : '';
            send('anniv ' + bdId + (fr ? ' ' + fr : ''));
            bdSaved[bdId] = fr;
            delete bdEdit[bdId];
            render();
            return;
        }
        var opt = b.getAttribute('data-opt');
        if (opt) {
            var on = !b.classList.contains('on');
            pendingOpts[opt] = on;
            b.classList.toggle('on', on);
            send('reglage ' + opt + ' ' + (on ? 'on' : 'off'));
            return;
        }
        var cmd = b.getAttribute('data-cmd');
        if (!cmd) return;
        if (b.classList.contains('done')) { toast('Déjà validé'); return; }
        var ask = b.getAttribute('data-confirm');
        if (ask && !confirm(ask)) return;
        send(cmd);
        b.style.outline = '2px solid var(--accent)';
    };

    start();
})();
</script>

</html>
